<svg xmlns="http://www.w3.org/2000/svg" width="600" height="270" viewBox="0 0 600 270" role="img" aria-label="BoviData: Offline-first livestock management platform: Flutter app syncing with a NestJS API.">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0E1325"/><stop offset="1" stop-color="#0A0E1B"/></linearGradient>
    <clipPath id="cl"><rect width="600" height="270" rx="16"/></clipPath>
    <radialGradient id="r" cx="1" cy="0" r="0.7"><stop offset="0" stop-color="#34D399" stop-opacity="0.22"/><stop offset="1" stop-color="#34D399" stop-opacity="0"/></radialGradient>
  </defs>
  <style>
    .t { font: 800 30px 'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif; fill:#F8FAFC; }
    .tag { font: 700 12px 'SFMono-Regular',Consolas,Menlo,monospace; letter-spacing: 2px; }
    .d { font: 400 16px 'Segoe UI','Inter',Arial,sans-serif; fill:#AAB4D4; }
    .n { font-family:'Segoe UI','Inter',Arial,sans-serif; font-weight:800; }
    .l { font: 500 13px 'Segoe UI','Inter',Arial,sans-serif; fill:#8A94B8; }
    .s { font: 500 13px 'SFMono-Regular',Consolas,Menlo,monospace; fill:#C7D2FE; }
  </style>
  <rect width="600" height="270" rx="16" fill="url(#g)"/>
  <rect width="600" height="270" rx="16" fill="url(#r)"/>
  <rect x="0" y="0" width="6" height="270" fill="#34D399" clip-path="url(#cl)"/>
  <text x="32" y="40" class="tag" fill="#34D399">CAPSTONE  ·  IN DEVELOPMENT</text>
  <text x="32" y="80" class="t">BoviData</text>
  <text x="32" y="112" class="d">Offline-first livestock management platform:</text><text x="32" y="134" class="d">Flutter app syncing with a NestJS API.</text>
  <text x="32" y="196" class="n" style="font-size:34px" fill="#34D399">26</text><text x="32" y="216" class="l">app modules</text><text x="212" y="196" class="n" style="font-size:34px" fill="#34D399">37</text><text x="212" y="216" class="l">data models</text><text x="392" y="196" class="n" style="font-size:34px" fill="#34D399">80</text><text x="392" y="216" class="l">automated tests</text>
  <line x1="32" y1="234" x2="568" y2="234" stroke="#222B4A"/>
  <text x="32" y="256" class="s">Flutter · NestJS · Prisma · PostgreSQL · Supabase</text>
  <rect x="0.5" y="0.5" width="599" height="269" rx="15.5" fill="none" stroke="#232C4D"/>
