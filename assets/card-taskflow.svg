    <clipPath id="cl"><rect width="600" height="270" rx="16"/></clipPath>
    <radialGradient id="r" cx="1" cy="0" r="0.7"><stop offset="0" stop-color="#60A5FA" stop-opacity="0.22"/><stop offset="1" stop-color="#60A5FA" stop-opacity="0"/></radialGradient>
  </defs>
  <style>
