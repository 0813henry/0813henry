  <text x="32" y="40" class="tag" fill="#60A5FA">FULL STACK  ·  ARCHITECTURE</text>
  <text x="32" y="80" class="t">TaskFlow</text>
  <text x="32" y="112" class="d">MERN task manager built with hexagonal</text><text x="32" y="134" class="d">architecture (ports &amp; adapters).</text>
  <text x="32" y="196" class="n" style="font-size:34px" fill="#60A5FA">4</text><text x="32" y="216" class="l">architecture layers</text><text x="212" y="196" class="n" style="font-size:34px" fill="#60A5FA">JWT</text><text x="212" y="216" class="l">+ bcrypt auth</text><text x="392" y="196" class="n" style="font-size:34px" fill="#60A5FA">Zod</text><text x="392" y="216" class="l">validation x2</text>
